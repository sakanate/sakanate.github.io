<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ get_url(path='css/main.css') }}">
        <title>{% block title %}sakanate{% endblock title %}</title>
    </head>
    <body>
        <header>
            <nav>
                <a href="/" style="flex: 1; font-weight: bold;">Kento "sakanate" Maruyama</a>

            </nav>
        </header>

        <main>
            {% block content %} {% endblock content %}
        </main>

        <footer>
            <p>
                <a href="mailto:kento.m@indiff.io">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">

                    </svg>
                    <span>Email</span>
                </a>

                <a href="https://github.com/sakanate">
                    <svg class="icon" viewBox="0 0 98 96" aria-hidden="true">
                        <use href="{{ get_url(path='icons/github.svg') }}#github"></use>
                    </svg>
                    <span>sakanate</span>
                </a>

        </footer>
