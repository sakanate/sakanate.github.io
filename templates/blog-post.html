{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock title %}

{% block content %}
<section>
    <h1 class="accent" style="margin-top: 1.5rem;">
        {{ page.title }}
    </h1>
    <p style="color: #555555; margin-bottom: 1.1rem;">{{ page.date }}</p>

    {{ page.content | safe }}
</section>
{% endblock content %}
