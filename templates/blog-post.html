{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock title %}

{% block content %}
<article>
    <header>
        <h1 class="accent" style="margin-bottom: 3px;">
            {{ page.title }}
        </h1>
        <span style="font-size: 1rem; color: #777777;">{{ page.date }}</span>
    </header>

    {{ page.content | safe }}
</article>
{% endblock content %}
